name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Static Site Bundle
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-v1.0.0}"
          FILENAME="DavITFuturesWebSiteMVC-${VER}-static-site.zip"
          cd public
          zip -r "../${FILENAME}" ./*
          cd ..

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./DavITFuturesWebSiteMVC-*-static-site.zip